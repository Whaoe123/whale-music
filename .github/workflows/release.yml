name: Release

# 打 tag 即发版：构建签名 APK → 创建 GitHub Release 附带 APK → 自动更新 update.json
# 用户端 App 启动时读 update.json，发现更高 versionCode 就弹窗下载安装。
# 签名密钥配置见 docs/RELEASE.md（必须先在仓库 Secrets 里配好，否则本工作流会失败）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，如 1.8（不带 v）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and signing
        id: meta
        env:
          KEYSTORE_B64: ${{ secrets.OHMUSIC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OHMUSIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OHMUSIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OHMUSIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secrets（OHMUSIC_KEYSTORE_BASE64 / OHMUSIC_KEYSTORE_PASSWORD / OHMUSIC_KEY_ALIAS / OHMUSIC_KEY_PASSWORD），配置方法见 docs/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/whale.jks"
          # versionCode 在 update.json 基础上 +1，保证单调递增
          CODE=$(python3 -c "import json;print(json.load(open('update.json'))['versionCode']+1)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Whale $VERSION (versionCode $CODE)"

      - name: Build signed release APK
        env:
          OHMUSIC_KEYSTORE_FILE: ${{ runner.temp }}/whale.jks
          OHMUSIC_KEYSTORE_PASSWORD: ${{ secrets.OHMUSIC_KEYSTORE_PASSWORD }}
          OHMUSIC_KEY_ALIAS: ${{ secrets.OHMUSIC_KEY_ALIAS }}
          OHMUSIC_KEY_PASSWORD: ${{ secrets.OHMUSIC_KEY_PASSWORD }}
          OHMUSIC_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          OHMUSIC_VERSION_NAME: Whale ${{ steps.meta.outputs.version }}
        run: ./gradlew assembleRelease --no-parallel --stacktrace

      - name: Package APK and checksum
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          OUT="whale-music-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="v${VERSION}"; fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" "${{ steps.pkg.outputs.name }}" \
              --title "Whale ${VERSION}" \
              --notes "应用内更新会自动提示这个版本。APK sha256：\`${{ steps.pkg.outputs.sha }}\`" \
              --verify-tag
          else
            gh release create "$TAG" "${{ steps.pkg.outputs.name }}" \
              --title "Whale ${VERSION}" \
              --notes "应用内更新会自动提示这个版本。APK sha256：\`${{ steps.pkg.outputs.sha }}\`"
          fi

      - name: Update update.json so in-app updater sees the new version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.version_code }}
          SHA: ${{ steps.pkg.outputs.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # workflow_dispatch 时 github.ref_name 是分支名（main），必须换成 tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="v${VERSION}"; fi
          TAG="${TAG:-v${VERSION}}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.pkg.outputs.name }}"
          python3 - "$URL" "$CODE" "$VERSION" "$SHA" <<'PY'
          import json, sys, io
          url, code, version, sha = sys.argv[1:5]
          data = {
              "versionCode": int(code),
              "versionName": f"Whale {version}",
              "url": url,
              "sha256": sha,
              "changelog": f"Whale {version}",
          }
          with io.open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 无变化"
          else
            git commit -m "chore(release): update update.json for Whale ${VERSION}"
            git push origin main
          fi
